<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800px" height="490px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-alt { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-highlight { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">三层架构设计</text>

<rect class="box" x="30" y="70" width="740" height="90"/>
<text class="text-title" x="50" y="95">用户交互层 (Interaction Layer)</text>
<text class="text" x="70" y="120">CLI (命令行)</text>
<text class="text" x="220" y="120">llm-chat (智能对话)</text>
<text class="text" x="390" y="120">Web UI (Web 界面)</text>
<text class="text" x="560" y="120">API (开放接口)</text>

<line class="arrow" x1="400" y1="160" x2="400" y2="180"/>

<rect class="box-alt" x="30" y="190" width="740" height="110"/>
<text class="text-title" x="50" y="215">Agent SDK 协议层 (Protocol Layer)</text>
<text class="text" x="70" y="240">• Command Registry (命令注册中心)</text>
<text class="text" x="70" y="260">• Command Executor (命令执行器)</text>
<text class="text" x="400" y="240">• Task Queue (任务队列)</text>
<text class="text" x="400" y="260">• Messaging Service (消息服务)</text>

<line class="arrow" x1="400" y1="300" x2="400" y2="320"/>

<rect class="box-highlight" x="30" y="330" width="740" height="110"/>
<text class="text-title" x="50" y="355">SceneEngine 场景层 (Orchestration Layer)</text>
<text class="text" x="70" y="380">• 场景管理 (有状态)</text>
<text class="text" x="250" y="380">• 编排协调 (多 Skill)</text>
<text class="text" x="450" y="380">• 事件驱动 (发布订阅)</text>
<text class="text" x="70" y="400">• SceneContextApi</text>
<text class="text" x="250" y="400">• CapabilityBindingService</text>
<text class="text" x="450" y="400">• SceneEventBus</text>

<line class="arrow" x1="400" y1="440" x2="400" y2="460"/>

<text class="text-small" x="400" y="475" text-anchor="middle">Skill 运行时层 (Plugin Runtime)</text>
</svg>
