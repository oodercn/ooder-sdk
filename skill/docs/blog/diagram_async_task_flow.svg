<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800px" height="580px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-alt { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-highlight { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">异步任务执行流程</text>

<rect class="box" x="30" y="70" width="740" height="50"/>
<text class="text-title" x="50" y="90">1. 任务提交</text>
<text class="text" x="70" y="110">CLI/Chat → skill exec rag-skill reindex --knowledgeBase=docs</text>

<line class="arrow" x1="400" y1="120" x2="400" y2="140"/>

<rect class="box" x="30" y="150" width="740" height="70"/>
<text class="text-title" x="50" y="170">2. 命令转换</text>
<text class="text" x="70" y="195">CLI Command → Agent SDK Command</text>
<text class="text-small" x="70" y="212">commandId: "rag-skill:reindex", type: ASYNC, parameters: {knowledgeBase: "docs"}</text>

<line class="arrow" x1="400" y1="220" x2="400" y2="240"/>

<rect class="box-alt" x="30" y="250" width="740" height="90"/>
<text class="text-title" x="50" y="270">3. 任务入队 (Task Queue)</text>
<text class="text" x="70" y="295">Task ID: task-abc-123</text>
<text class="text" x="250" y="295">Status: PENDING</text>
<text class="text" x="450" y="295">Priority: NORMAL</text>
<text class="text" x="70" y="315">Created: 2024-01-15T10:30:00Z</text>
<text class="text" x="250" y="315">Command: rag-skill:reindex</text>

<line class="arrow" x1="400" y1="340" x2="400" y2="360"/>

<rect class="box-highlight" x="30" y="370" width="740" height="90"/>
<text class="text-title" x="50" y="390">4. 异步执行 (Task Worker)</text>
<text class="text" x="70" y="415">1. Dequeue task</text>
<text class="text" x="250" y="415">2. Update status: RUNNING</text>
<text class="text" x="450" y="415">3. Execute Command.execute()</text>
<text class="text" x="70" y="435">4. Update status: COMPLETED/FAILED</text>
<text class="text" x="350" y="435">5. Notify listeners</text>

<line class="arrow" x1="400" y1="460" x2="400" y2="480"/>

<rect class="box" x="30" y="490" width="740" height="70"/>
<text class="text-title" x="50" y="510">5. 状态查询</text>
<text class="text" x="70" y="535">CLI/Chat → skill task status task-abc-123</text>
<text class="text-small" x="70" y="552">Result: {taskId: "task-abc-123", status: "COMPLETED", result: {documentsIndexed: 1500}}</text>
</svg>
