<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800px" height="490px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-alt { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-highlight { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">多活部署架构</text>

<rect class="box-alt" x="250" y="70" width="300" height="50"/>
<text class="text-title" x="400" y="90" text-anchor="middle">Load Balancer</text>
<text class="text-small" x="400" y="108" text-anchor="middle">(Round Robin)</text>

<line class="arrow" x1="400" y1="120" x2="400" y2="140"/>

<rect class="box" x="50" y="150" width="220" height="90"/>
<text class="text-title" x="160" y="170" text-anchor="middle">Node 1</text>
<text class="text" x="160" y="195" text-anchor="middle">Agent SDK</text>
<text class="text-small" x="160" y="215" text-anchor="middle">Instance 1</text>

<rect class="box" x="290" y="150" width="220" height="90"/>
<text class="text-title" x="400" y="170" text-anchor="middle">Node 2</text>
<text class="text" x="400" y="195" text-anchor="middle">Agent SDK</text>
<text class="text-small" x="400" y="215" text-anchor="middle">Instance 2</text>

<rect class="box" x="530" y="150" width="220" height="90"/>
<text class="text-title" x="640" y="170" text-anchor="middle">Node 3</text>
<text class="text" x="640" y="195" text-anchor="middle">Agent SDK</text>
<text class="text-small" x="640" y="215" text-anchor="middle">Instance 3</text>

<line class="arrow" x1="400" y1="240" x2="400" y2="270"/>

<rect class="box-highlight" x="30" y="280" width="740" height="120"/>
<text class="text-title" x="400" y="305" text-anchor="middle">Shared Storage</text>

<rect class="box-alt" x="50" y="315" width="200" height="70"/>
<text class="text" x="150" y="335" text-anchor="middle">Task Queue</text>
<text class="text-small" x="150" y="355" text-anchor="middle">(Redis)</text>

<rect class="box-alt" x="300" y="315" width="200" height="70"/>
<text class="text" x="400" y="335" text-anchor="middle">Command Registry</text>
<text class="text-small" x="400" y="355" text-anchor="middle">(Database)</text>

<rect class="box-alt" x="550" y="315" width="200" height="70"/>
<text class="text" x="650" y="335" text-anchor="middle">Audit Log</text>
<text class="text-small" x="650" y="355" text-anchor="middle">(Elasticsearch)</text>

<text class="text-small" x="400" y="420" text-anchor="middle">关键特性：无状态 · 共享存储 · 负载均衡 · 故障转移</text>
</svg>
