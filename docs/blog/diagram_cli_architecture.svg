<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800px" height="490px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-alt { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-highlight { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">CLI 架构设计</text>

<!-- CLI Tool Layer -->
<rect class="box" x="30" y="70" width="740" height="120"/>
<text class="text-title" x="50" y="95">CLI 工具层</text>
<rect class="box-alt" x="50" y="110" width="160" height="60" rx="6"/>
<text class="text" x="130" y="145" text-anchor="middle">命令解析</text>
<rect class="box-alt" x="230" y="110" width="160" height="60" rx="6"/>
<text class="text" x="310" y="145" text-anchor="middle">权限校验</text>
<rect class="box-alt" x="410" y="110" width="160" height="60" rx="6"/>
<text class="text" x="490" y="145" text-anchor="middle">结果展示</text>
<rect class="box-alt" x="590" y="110" width="160" height="60" rx="6"/>
<text class="text" x="670" y="145" text-anchor="middle">交互模式</text>

<!-- Arrow 1 -->
<line class="arrow" x1="400" y1="190" x2="400" y2="220"/>

<!-- Agent SDK Layer -->
<rect class="box" x="30" y="220" width="740" height="120"/>
<text class="text-title" x="50" y="245">Agent SDK 协议层</text>
<rect class="box-alt" x="50" y="260" width="220" height="60" rx="6"/>
<text class="text" x="160" y="295" text-anchor="middle">Command 通道</text>
<rect class="box-alt" x="290" y="260" width="220" height="60" rx="6"/>
<text class="text" x="400" y="295" text-anchor="middle">异步任务</text>
<rect class="box-alt" x="530" y="260" width="220" height="60" rx="6"/>
<text class="text" x="640" y="295" text-anchor="middle">消息队列</text>

<!-- Arrow 2 -->
<line class="arrow" x1="400" y1="340" x2="400" y2="370"/>

<!-- SceneEngine Layer -->
<rect class="box" x="30" y="370" width="740" height="100"/>
<text class="text-title" x="50" y="395">SceneEngine 场景层</text>
<rect class="box-alt" x="50" y="410" width="220" height="50" rx="6"/>
<text class="text" x="160" y="440" text-anchor="middle">场景编排</text>
<rect class="box-alt" x="290" y="410" width="220" height="50" rx="6"/>
<text class="text" x="400" y="440" text-anchor="middle">事件驱动</text>
<rect class="box-alt" x="530" y="410" width="220" height="50" rx="6"/>
<text class="text" x="640" y="440" text-anchor="middle">状态管理</text>

</svg>