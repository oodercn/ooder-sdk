<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800px" height="580px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-alt { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-highlight { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">WebConsole 集成架构</text>

<!-- WebConsole Layer -->
<rect class="box" x="30" y="70" width="740" height="140"/>
<text class="text-title" x="50" y="95">WebConsole 层</text>
<rect class="box-alt" x="50" y="110" width="160" height="80" rx="6"/>
<text class="text" x="130" y="145" text-anchor="middle">Web 终端界面</text>
<text class="text-small" x="130" y="165" text-anchor="middle">用户交互界面</text>
<rect class="box-alt" x="230" y="110" width="160" height="80" rx="6"/>
<text class="text" x="310" y="145" text-anchor="middle">命令自动补全</text>
<text class="text-small" x="310" y="165" text-anchor="middle">智能提示</text>
<rect class="box-alt" x="410" y="110" width="160" height="80" rx="6"/>
<text class="text" x="490" y="145" text-anchor="middle">LLM 辅助提示</text>
<text class="text-small" x="490" y="165" text-anchor="middle">AI 增强</text>
<rect class="box-alt" x="590" y="110" width="160" height="80" rx="6"/>
<text class="text" x="670" y="145" text-anchor="middle">实时命令执行</text>
<text class="text-small" x="670" y="165" text-anchor="middle">即时反馈</text>

<!-- Arrow 1 -->
<line class="arrow" x1="400" y1="210" x2="400" y2="240"/>

<!-- LLM Layer -->
<rect class="box" x="30" y="240" width="740" height="140"/>
<text class="text-title" x="50" y="265">LLM 辅助层</text>
<rect class="box-alt" x="50" y="280" width="160" height="80" rx="6"/>
<text class="text" x="130" y="315" text-anchor="middle">自然语言转命令</text>
<text class="text-small" x="130" y="335" text-anchor="middle">NLP 处理</text>
<rect class="box-alt" x="230" y="280" width="160" height="80" rx="6"/>
<text class="text" x="310" y="315" text-anchor="middle">命令智能推荐</text>
<text class="text-small" x="310" y="335" text-anchor="middle">上下文理解</text>
<rect class="box-alt" x="410" y="280" width="160" height="80" rx="6"/>
<text class="text" x="490" y="315" text-anchor="middle">错误诊断与修复</text>
<text class="text-small" x="490" y="335" text-anchor="middle">智能纠错</text>
<rect class="box-alt" x="590" y="280" width="160" height="80" rx="6"/>
<text class="text" x="670" y="315" text-anchor="middle">命令文档生成</text>
<text class="text-small" x="670" y="335" text-anchor="middle">自动文档</text>

<!-- Arrow 2 -->
<line class="arrow" x1="400" y1="380" x2="400" y2="410"/>

<!-- CLI Execution Layer -->
<rect class="box" x="30" y="410" width="740" height="140"/>
<text class="text-title" x="50" y="435">CLI 执行层</text>
<rect class="box-alt" x="50" y="450" width="220" height="80" rx="6"/>
<text class="text" x="160" y="485" text-anchor="middle">命令解析与路由</text>
<text class="text-small" x="160" y="505" text-anchor="middle">分发到对应处理器</text>
<rect class="box-alt" x="290" y="450" width="220" height="80" rx="6"/>
<text class="text" x="400" y="485" text-anchor="middle">安全校验</text>
<text class="text-small" x="400" y="505" text-anchor="middle">权限和注入检测</text>
<rect class="box-alt" x="530" y="450" width="220" height="80" rx="6"/>
<text class="text" x="640" y="485" text-anchor="middle">结果格式化</text>
<text class="text-small" x="640" y="505" text-anchor="middle">多种输出格式</text>

</svg>