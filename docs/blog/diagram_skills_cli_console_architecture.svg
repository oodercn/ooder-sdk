<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800px" height="620px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-alt { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-highlight { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 10px; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">skills-cli-console 多渠道架构</text>

<!-- Multi-channel Access Layer -->
<rect class="box" x="30" y="70" width="740" height="120"/>
<text class="text-title" x="50" y="95">多渠道接入层</text>

<!-- Channel boxes -->
<rect class="box-alt" x="50" y="110" width="150" height="60" rx="6"/>
<text class="text" x="125" y="135" text-anchor="middle" font-weight="bold">Agent-Chat</text>
<text class="text-small" x="125" y="150" text-anchor="middle">小助手</text>

<rect class="box-alt" x="220" y="110" width="150" height="60" rx="6"/>
<text class="text" x="295" y="135" text-anchor="middle" font-weight="bold">CLI-Console</text>
<text class="text-small" x="295" y="150" text-anchor="middle">Chat 窗口</text>

<rect class="box-alt" x="390" y="110" width="150" height="60" rx="6"/>
<text class="text" x="465" y="135" text-anchor="middle" font-weight="bold">钉钉机器人</text>
<text class="text-small" x="465" y="150" text-anchor="middle">企业通讯</text>

<rect class="box-alt" x="560" y="110" width="150" height="60" rx="6"/>
<text class="text" x="635" y="135" text-anchor="middle" font-weight="bold">微信/飞书</text>
<text class="text-small" x="635" y="150" text-anchor="middle">多平台集成</text>

<!-- Connection lines -->
<line class="arrow" x1="125" y1="170" x2="125" y2="200"/>
<line class="arrow" x1="295" y1="170" x2="295" y2="200"/>
<line class="arrow" x1="465" y1="170" x2="465" y2="200"/>
<line class="arrow" x1="635" y1="170" x2="635" y2="200"/>

<!-- Merge point -->
<line x1="125" y1="200" x2="635" y2="200" stroke="#64748b" stroke-width="2"/>
<line class="arrow" x1="400" y1="200" x2="400" y2="230"/>

<!-- NLP Processing Layer -->
<rect class="box" x="30" y="230" width="740" height="140"/>
<text class="text-title" x="50" y="255">NLP 处理层 (LLM 驱动)</text>

<rect class="box-alt" x="50" y="270" width="160" height="80" rx="6"/>
<text class="text" x="130" y="300" text-anchor="middle" font-weight="bold">自然语言理解</text>
<text class="text-small" x="130" y="315" text-anchor="middle">(NLU)</text>
<text class="text-small" x="130" y="330" text-anchor="middle">意图识别</text>

<rect class="box-alt" x="230" y="270" width="160" height="80" rx="6"/>
<text class="text" x="310" y="300" text-anchor="middle" font-weight="bold">命令映射</text>
<text class="text-small" x="310" y="315" text-anchor="middle">意图转命令</text>
<text class="text-small" x="310" y="330" text-anchor="middle">参数提取</text>

<rect class="box-alt" x="410" y="270" width="160" height="80" rx="6"/>
<text class="text" x="490" y="300" text-anchor="middle" font-weight="bold">上下文管理</text>
<text class="text-small" x="490" y="315" text-anchor="middle">多轮对话</text>
<text class="text-small" x="490" y="330" text-anchor="middle">状态追踪</text>

<rect class="box-alt" x="590" y="270" width="160" height="80" rx="6"/>
<text class="text" x="670" y="300" text-anchor="middle" font-weight="bold">智能推荐</text>
<text class="text-small" x="670" y="315" text-anchor="middle">错误修复</text>
<text class="text-small" x="670" y="330" text-anchor="middle">命令建议</text>

<!-- Arrow -->
<line class="arrow" x1="400" y1="370" x2="400" y2="400"/>

<!-- CLI Execution Engine -->
<rect class="box" x="30" y="400" width="740" height="140"/>
<text class="text-title" x="50" y="425">CLI 执行引擎</text>

<rect class="box-alt" x="50" y="440" width="160" height="80" rx="6"/>
<text class="text" x="130" y="470" text-anchor="middle" font-weight="bold">命令解析</text>
<text class="text-small" x="130" y="485" text-anchor="middle">语法分析</text>
<text class="text-small" x="130" y="500" text-anchor="middle">路由分发</text>

<rect class="box-alt" x="230" y="440" width="160" height="80" rx="6"/>
<text class="text" x="310" y="470" text-anchor="middle" font-weight="bold">权限校验</text>
<text class="text-small" x="310" y="485" text-anchor="middle">安全审计</text>
<text class="text-small" x="310" y="500" text-anchor="middle">访问控制</text>

<rect class="box-alt" x="410" y="440" width="160" height="80" rx="6"/>
<text class="text" x="490" y="470" text-anchor="middle" font-weight="bold">任务管理</text>
<text class="text-small" x="490" y="485" text-anchor="middle">异步执行</text>
<text class="text-small" x="490" y="500" text-anchor="middle">状态监控</text>

<rect class="box-alt" x="590" y="440" width="160" height="80" rx="6"/>
<text class="text" x="670" y="470" text-anchor="middle" font-weight="bold">结果格式化</text>
<text class="text-small" x="670" y="485" text-anchor="middle">多格式输出</text>
<text class="text-small" x="670" y="500" text-anchor="middle">反馈生成</text>

<!-- Platform labels -->
<text class="text-small" x="125" y="85" text-anchor="middle" font-style="italic">Web/桌面</text>
<text class="text-small" x="295" y="85" text-anchor="middle" font-style="italic">专用窗口</text>
<text class="text-small" x="465" y="85" text-anchor="middle" font-style="italic">企业IM</text>
<text class="text-small" x="635" y="85" text-anchor="middle" font-style="italic">社交平台</text>

</svg>