# Ooder CLI Configuration
ooder:
  cli:
    # 安全配置
    security:
      enabled: true
      whitelist-enabled: true
      injection-check-enabled: true
      dangerous-chars-check-enabled: true
      audit-enabled: true
      
      # 命令白名单
      whitelist:
        - skill:list
        - skill:info
        - skill:install
        - skill:uninstall
        - skill:update
        - skill:start
        - skill:stop
        - skill:exec
        - scene:list
        - scene:create
        - scene:info
        - scene:invoke
        - scene:event
        - task:list
        - task:status
        - status
        - help
      
      # 敏感字段
      sensitive-keys:
        - password
        - secret
        - token
        - key
        - api-key
        - credential
        - auth
        - private-key
        - access-token
        - refresh-token
      
      # 安全检测正则表达式
      dangerous-chars-pattern: "[;|&$`\\{}\\[\\]\\(\\)\\*\\?<>]"
      sql-injection-pattern: "(\\b(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION)\\b)|(--|#|/\\*)"
      script-injection-pattern: "<script|javascript:|on\\w+\\s*="
    
    # 输出配置
    output:
      default-format: text
      color-enabled: true
      
    # 交互式配置
    interactive:
      enabled: true
      history-size: 1000
      history-file: "${user.home}/.ooder/cli-history"
      prompt: "ooder> "
      
    # 任务配置
    task:
      default-timeout: 60
      cleanup-interval: 3600  # 秒
      max-concurrent: 10
