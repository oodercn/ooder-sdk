<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700px" height="400px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-runtime { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-skill { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">插件化能力架构</text>

<!-- Runtime -->
<rect class="box-runtime" x="250" y="80" width="200" height="50"/>
<text class="text-title" x="350" y="110" text-anchor="middle">ooderAgent Runtime</text>

<!-- Skills -->
<rect class="box-skill" x="50" y="180" width="140" height="80"/>
<text class="text-title" x="120" y="205" text-anchor="middle">Skill A</text>
<text class="text" x="65" y="230">天气服务</text>
<text class="text" x="65" y="250">独立部署/升级</text>

<rect class="box-skill" x="280" y="180" width="140" height="80"/>
<text class="text-title" x="350" y="205" text-anchor="middle">Skill B</text>
<text class="text" x="295" y="230">邮件服务</text>
<text class="text" x="295" y="250">独立部署/升级</text>

<rect class="box-skill" x="510" y="180" width="140" height="80"/>
<text class="text-title" x="580" y="205" text-anchor="middle">Skill C</text>
<text class="text" x="525" y="230">HR助手</text>
<text class="text" x="525" y="250">独立部署/升级</text>

<!-- Arrows -->
<line class="arrow" x1="300" y1="130" x2="120" y2="180"/>
<line class="arrow" x1="350" y1="130" x2="350" y2="180"/>
<line class="arrow" x1="400" y1="130" x2="580" y2="180"/>

<!-- Values -->
<rect class="box" x="50" y="300" width="600" height="70"/>
<text class="text-title" x="350" y="325" text-anchor="middle">核心价值</text>
<text class="text" x="80" y="350">• 解耦：各Skill独立开发、部署、运维</text>
<text class="text" x="80" y="365">• 可扩展：按需安装新Skill</text>
<text class="text" x="400" y="350">• 可替换：同类型Skill可替换</text>
<text class="text" x="400" y="365">• 可组合：多Skill组合业务流程</text>

</svg>
