<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-tx { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">事务性状态转换</text>

<!-- Install Operation -->
<rect class="box-tx" x="50" y="80" width="280" height="120"/>
<text class="text-title" x="190" y="105" text-anchor="middle">安装操作 (INSTALL)</text>
<text class="text" x="65" y="130">1. 验证依赖</text>
<text class="text" x="65" y="150">2. 分配资源</text>
<text class="text" x="65" y="170">3. 注册能力</text>
<text class="text" x="65" y="190">4. 状态变更 → INSTALLED</text>

<!-- Activate Operation -->
<rect class="box-tx" x="370" y="80" width="280" height="120"/>
<text class="text-title" x="510" y="105" text-anchor="middle">激活操作 (ACTIVATE)</text>
<text class="text" x="385" y="130">1. 检查依赖状态</text>
<text class="text" x="385" y="150">2. 初始化运行时</text>
<text class="text" x="385" y="170">3. 建立连接</text>
<text class="text" x="385" y="190">4. 状态变更 → ACTIVATED</text>

<!-- Rollback -->
<rect class="box" x="50" y="230" width="280" height="50"/>
<text class="text" x="190" y="255" text-anchor="middle" fill="#dc2626">失败时: 自动回滚到 DISCOVERED</text>

<rect class="box" x="370" y="230" width="280" height="50"/>
<text class="text" x="510" y="255" text-anchor="middle" fill="#dc2626">失败时: 自动回滚到 INSTALLED</text>

<!-- Arrows -->
<line class="arrow" x1="190" y1="200" x2="190" y2="230"/>
<line class="arrow" x1="510" y1="200" x2="510" y2="230"/>

</svg>
