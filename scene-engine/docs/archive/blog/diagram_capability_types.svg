<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-entry { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-exposed { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
        .box-internal { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 8; }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 14px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">能力类型体系</text>

<!-- Entry Capability -->
<rect class="box-entry" x="50" y="80" width="180" height="120"/>
<text class="text-title" x="140" y="110" text-anchor="middle">ENTRY (入口能力)</text>
<text class="text" x="65" y="135">作为用户交互的入口点</text>
<text class="text" x="65" y="155">通常是对话、命令类能力</text>
<text class="text" x="65" y="175">示例: chat, execute</text>

<!-- Exposed Capability -->
<rect class="box-exposed" x="260" y="80" width="180" height="120"/>
<text class="text-title" x="350" y="110" text-anchor="middle">EXPOSED (对外暴露)</text>
<text class="text" x="275" y="135">可被其他Skill调用</text>
<text class="text" x="275" y="155">形成Skill间协作基础</text>
<text class="text" x="275" y="175">示例: queryEmployeeInfo</text>

<!-- Internal Capability -->
<rect class="box-internal" x="470" y="80" width="180" height="120"/>
<text class="text-title" x="560" y="110" text-anchor="middle">INTERNAL (内部能力)</text>
<text class="text" x="485" y="135">仅供Skill内部使用</text>
<text class="text" x="485" y="155">不对外暴露，保证封装性</text>
<text class="text" x="485" y="175">示例: validateData</text>

<!-- Comparison Table -->
<rect class="box" x="50" y="240" width="600" height="80"/>
<text class="text-title" x="350" y="265" text-anchor="middle">可见性对比</text>
<text class="text" x="80" y="290">ENTRY: 用户直接调用</text>
<text class="text" x="280" y="290">EXPOSED: 跨Skill调用</text>
<text class="text" x="480" y="290">INTERNAL: 内部私有</text>
<text class="text" x="80" y="310">可作为对话入口</text>
<text class="text" x="280" y="310">通过CAP协议调用</text>
<text class="text" x="480" y="310">不对外暴露</text>

</svg>
