<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700px" height="450px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-ontology { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-semantic { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">用友本体论架构</text>

<!-- Business Ontology Layer -->
<rect class="box-ontology" x="200" y="70" width="300" height="50" rx="8"/>
<text class="text-title" x="350" y="100" text-anchor="middle">业务本体层 (Business Ontology)</text>

<!-- Domain Ontologies -->
<rect class="box" x="50" y="160" width="150" height="60"/>
<text class="text-title" x="125" y="185" text-anchor="middle">财务本体</text>
<text class="text-small" x="125" y="205" text-anchor="middle">会计科目、凭证</text>

<rect class="box" x="275" y="160" width="150" height="60"/>
<text class="text-title" x="350" y="185" text-anchor="middle">人力本体</text>
<text class="text-small" x="350" y="205" text-anchor="middle">员工、组织、薪酬</text>

<rect class="box" x="500" y="160" width="150" height="60"/>
<text class="text-title" x="575" y="185" text-anchor="middle">供应链本体</text>
<text class="text-small" x="575" y="205" text-anchor="middle">采购、库存、物流</text>

<!-- Arrows from Business to Domain -->
<line class="arrow" x1="280" y1="120" x2="125" y2="160"/>
<line class="arrow" x1="350" y1="120" x2="350" y2="160"/>
<line class="arrow" x1="420" y1="120" x2="575" y2="160"/>

<!-- Semantic Data Layer -->
<rect class="box-semantic" x="150" y="280" width="400" height="50" rx="8"/>
<text class="text-title" x="350" y="310" text-anchor="middle">数据语义层 (Semantic Data)</text>

<!-- Arrows from Domain to Semantic -->
<line class="arrow" x1="125" y1="220" x2="250" y2="280"/>
<line class="arrow" x1="350" y1="220" x2="350" y2="280"/>
<line class="arrow" x1="575" y1="220" x2="450" y2="280"/>

<!-- Value Points -->
<text class="text-title" x="350" y="370" text-anchor="middle">核心价值</text>
<text class="text" x="100" y="400">• 统一企业业务语义模型</text>
<text class="text" x="100" y="420">• 跨系统的概念映射</text>
<text class="text" x="400" y="400">• 数据语义标准化</text>
<text class="text" x="400" y="420">• 为AI理解业务提供基础</text>

</svg>
