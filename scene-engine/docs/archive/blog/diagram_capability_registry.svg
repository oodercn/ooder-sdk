<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-meta { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-version { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
        .box-instance { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">能力注册中心</text>

<!-- Metadata Management -->
<rect class="box-meta" x="50" y="80" width="180" height="100"/>
<text class="text-title" x="140" y="105" text-anchor="middle">元数据管理</text>
<text class="text" x="65" y="130">• 能力定义注册</text>
<text class="text" x="65" y="150">• 参数Schema管理</text>
<text class="text" x="65" y="170">• 描述信息维护</text>

<!-- Version Control -->
<rect class="box-version" x="260" y="80" width="180" height="100"/>
<text class="text-title" x="350" y="105" text-anchor="middle">版本控制</text>
<text class="text" x="275" y="130">• 多版本共存</text>
<text class="text" x="275" y="150">• 版本路由策略</text>
<text class="text" x="275" y="170">• 灰度发布支持</text>

<!-- Instance Management -->
<rect class="box-instance" x="470" y="80" width="180" height="100"/>
<text class="text-title" x="560" y="105" text-anchor="middle">实例管理</text>
<text class="text" x="485" y="130">• 实例注册/注销</text>
<text class="text" x="485" y="150">• 健康状态监控</text>
<text class="text" x="485" y="170">• 负载均衡支持</text>

<!-- Bottom summary -->
<rect class="box" x="50" y="220" width="600" height="80"/>
<text class="text-title" x="350" y="245" text-anchor="middle">核心功能</text>
<text class="text" x="80" y="270">• 统一的能力元数据管理</text>
<text class="text" x="80" y="290">• 支持多版本共存与灰度发布</text>
<text class="text" x="400" y="270">• 实例健康监控与故障转移</text>
<text class="text" x="400" y="290">• 完整的能力生命周期管理</text>

</svg>
