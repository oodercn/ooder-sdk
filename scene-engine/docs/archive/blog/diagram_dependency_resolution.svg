<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700px" height="400px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-dep { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 14px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">依赖解析算法</text>

<!-- Dependency Graph -->
<text class="text-title" x="350" y="75" text-anchor="middle">输入依赖图</text>

<rect class="box-dep" x="300" y="90" width="80" height="40"/>
<text class="text-title" x="340" y="115" text-anchor="middle">A</text>

<rect class="box-dep" x="150" y="160" width="80" height="40"/>
<text class="text-title" x="190" y="185" text-anchor="middle">B</text>

<rect class="box-dep" x="450" y="160" width="80" height="40"/>
<text class="text-title" x="490" y="185" text-anchor="middle">F</text>

<rect class="box-dep" x="80" y="230" width="80" height="40"/>
<text class="text-title" x="120" y="255" text-anchor="middle">C</text>

<rect class="box-dep" x="220" y="230" width="80" height="40"/>
<text class="text-title" x="260" y="255" text-anchor="middle">D</text>

<rect class="box-dep" x="360" y="230" width="80" height="40"/>
<text class="text-title" x="400" y="255" text-anchor="middle">E</text>

<!-- Arrows -->
<line class="arrow" x1="300" y1="110" x2="230" y2="160"/>
<line class="arrow" x1="380" y1="110" x2="450" y2="160"/>
<line class="arrow" x1="190" y1="200" x2="120" y2="230"/>
<line class="arrow" x1="190" y1="200" x2="260" y2="230"/>
<line class="arrow" x1="260" y1="270" x2="400" y2="270"/>
<line class="arrow" x1="260" y1="270" x2="260" y2="270"/>

<!-- Result -->
<text class="text-title" x="550" y="100" text-anchor="middle">拓扑排序结果</text>
<rect class="box" x="500" y="120" width="180" height="30"/>
<text class="text" x="590" y="140" text-anchor="middle">[C, E, D, B, F, A]</text>

<text class="text-title" x="550" y="180" text-anchor="middle">安装顺序</text>
<rect class="box" x="500" y="200" width="180" height="30"/>
<text class="text" x="590" y="220" text-anchor="middle">C, E → D, B → F → A</text>

<text class="text-small" x="550" y="260" text-anchor="middle">先安装无依赖的</text>
<text class="text-small" x="550" y="280" text-anchor="middle">再安装依赖已满足的</text>

</svg>
