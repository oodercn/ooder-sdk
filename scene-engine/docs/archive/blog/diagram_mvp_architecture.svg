<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700px" height="400px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-app { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-engine { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
        .box-capability { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
        .box-infra { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">ooderAgent MVP架构</text>

<!-- Application Layer -->
<rect class="box-app" x="150" y="70" width="400" height="50"/>
<text class="text-title" x="350" y="100" text-anchor="middle">应用层：Web控制台 | REST API | WebSocket</text>

<!-- Engine Layer -->
<rect class="box-engine" x="150" y="150" width="400" height="50"/>
<text class="text-title" x="350" y="180" text-anchor="middle">引擎层：SceneEngine | ActivationFlow | CapabilityRegistry | Discovery</text>

<!-- Capability Layer -->
<rect class="box-capability" x="150" y="230" width="400" height="50"/>
<text class="text-title" x="350" y="260" text-anchor="middle">能力层：LLM Provider | Knowledge | Storage | Custom Skills</text>

<!-- Infrastructure Layer -->
<rect class="box-infra" x="150" y="310" width="400" height="50"/>
<text class="text-title" x="350" y="340" text-anchor="middle">基础设施：PostgreSQL | Redis | Milvus</text>

<!-- Arrows -->
<line class="arrow" x1="350" y1="120" x2="350" y2="150"/>
<line class="arrow" x1="350" y1="200" x2="350" y2="230"/>
<line class="arrow" x1="350" y1="280" x2="350" y2="310"/>

</svg>
