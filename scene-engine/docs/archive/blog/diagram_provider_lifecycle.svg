<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-active { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">Provider生命周期</text>

<!-- States -->
<rect class="box" x="100" y="100" width="100" height="40"/>
<text class="text-title" x="150" y="125" text-anchor="middle">Created</text>

<rect class="box" x="250" y="100" width="100" height="40"/>
<text class="text-title" x="300" y="125" text-anchor="middle">Initialized</text>

<rect class="box-active" x="400" y="100" width="100" height="40"/>
<text class="text-title" x="450" y="125" text-anchor="middle">Running</text>

<rect class="box" x="550" y="100" width="100" height="40"/>
<text class="text-title" x="600" y="125" text-anchor="middle">Stopped</text>

<!-- Arrows -->
<line class="arrow" x1="200" y1="120" x2="250" y2="120"/>
<line class="arrow" x1="350" y1="120" x2="400" y2="120"/>
<line class="arrow" x1="500" y1="120" x2="550" y2="120"/>

<!-- Method labels -->
<text class="text" x="225" y="110" text-anchor="middle">initialize()</text>
<text class="text" x="375" y="110" text-anchor="middle">start()</text>
<text class="text" x="525" y="110" text-anchor="middle">stop()</text>

<!-- Details -->
<rect class="box" x="50" y="200" width="600" height="100"/>
<text class="text-title" x="350" y="225" text-anchor="middle">Provider接口方法</text>
<text class="text" x="80" y="250">• getProviderName(): 提供者名称</text>
<text class="text" x="80" y="270">• initialize(engine): 初始化</text>
<text class="text" x="80" y="290">• start(): 启动服务</text>
<text class="text" x="400" y="250">• stop(): 停止服务</text>
<text class="text" x="400" y="270">• isRunning(): 是否运行中</text>
<text class="text" x="400" y="290">• getPriority(): 优先级</text>

</svg>
