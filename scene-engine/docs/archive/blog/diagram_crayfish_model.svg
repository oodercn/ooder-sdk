<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700px" height="400px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-index { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .arrow-flow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrowhead-blue); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">小龙虾能力检索模型</text>

<!-- Flow -->
<rect class="box" x="50" y="80" width="100" height="50"/>
<text class="text-title" x="100" y="110" text-anchor="middle">用户意图</text>

<line class="arrow-flow" x1="150" y1="105" x2="180" y2="105"/>

<rect class="box" x="190" y="80" width="120" height="50"/>
<text class="text-title" x="250" y="105" text-anchor="middle">能力检索引擎</text>

<line class="arrow-flow" x1="310" y1="105" x2="340" y2="105"/>

<rect class="box" x="350" y="80" width="100" height="50"/>
<text class="text-title" x="400" y="105" text-anchor="middle">能力匹配</text>

<line class="arrow-flow" x1="450" y1="105" x2="480" y2="105"/>

<rect class="box" x="490" y="80" width="100" height="50"/>
<text class="text-title" x="540" y="105" text-anchor="middle">能力执行</text>

<!-- Capability Index -->
<line class="arrow" x1="250" y1="130" x2="250" y2="170"/>
<rect class="box-index" x="150" y="180" width="200" height="120"/>
<text class="text-title" x="250" y="205" text-anchor="middle">能力索引库</text>
<text class="text" x="165" y="230">• 能力描述</text>
<text class="text" x="165" y="250">• 参数定义</text>
<text class="text" x="165" y="270">• 调用方式</text>
<text class="text" x="165" y="290">• 依赖关系</text>

<!-- Core Concepts -->
<text class="text-title" x="350" y="350" text-anchor="middle">核心理念</text>
<text class="text" x="100" y="375">• 软件能力可被检索</text>
<text class="text" x="100" y="395">• 意图到能力的智能映射</text>
<text class="text" x="400" y="375">• 能力的语义化描述</text>
<text class="text" x="400" y="395">• 能力发现与推荐</text>

</svg>
