<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-active { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 14px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">四阶段激活流程</text>

<!-- Phase 1 -->
<rect class="box" x="50" y="80" width="140" height="80"/>
<text class="text-title" x="120" y="105" text-anchor="middle">阶段1: INITIALIZING</text>
<text class="text" x="65" y="130">解析Skill元数据</text>
<text class="text" x="65" y="148">验证配置完整性</text>

<!-- Phase 2 -->
<rect class="box" x="210" y="80" width="140" height="80"/>
<text class="text-title" x="280" y="105" text-anchor="middle">阶段2: INSTALLING</text>
<text class="text" x="225" y="130">解析依赖列表</text>
<text class="text" x="225" y="148">拓扑排序安装顺序</text>

<!-- Phase 3 -->
<rect class="box" x="370" y="80" width="140" height="80"/>
<text class="text-title" x="440" y="105" text-anchor="middle">阶段3: CONFIGURING</text>
<text class="text" x="385" y="130">注入能力引用</text>
<text class="text" x="385" y="148">绑定配置参数</text>

<!-- Phase 4 -->
<rect class="box-active" x="530" y="80" width="140" height="80"/>
<text class="text-title" x="600" y="105" text-anchor="middle">阶段4: ACTIVATING</text>
<text class="text" x="545" y="130">启动运行时</text>
<text class="text" x="545" y="148">注册能力到中心</text>

<!-- Arrows -->
<line class="arrow" x1="190" y1="120" x2="210" y2="120"/>
<line class="arrow" x1="350" y1="120" x2="370" y2="120"/>
<line class="arrow" x1="510" y1="120" x2="530" y2="120"/>

<!-- Dependency Graph -->
<rect class="box" x="50" y="200" width="600" height="60"/>
<text class="text-title" x="350" y="225" text-anchor="middle">依赖解析示例: A → B → C + D → E</text>
<text class="text" x="100" y="248">安装顺序: C, E → D, B → A</text>

</svg>
