<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700px" height="400px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-old { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 8; stroke-dasharray: 5,5; }
        .box-new { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 14px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">ooderAgent解决方案全景</text>

<!-- Left: Problems -->
<rect class="box-old" x="50" y="80" width="180" height="140"/>
<text class="text-title" x="140" y="105" text-anchor="middle">传统困境</text>
<text class="text" x="65" y="130">• 能力边界模糊</text>
<text class="text" x="65" y="150">• 发现机制缺失</text>
<text class="text" x="65" y="170">• 生命周期混乱</text>
<text class="text" x="65" y="190">• 多Agent协作困难</text>

<!-- Center: Solution -->
<rect class="box-new" x="270" y="80" width="160" height="140"/>
<text class="text-title" x="350" y="105" text-anchor="middle">ooderAgent</text>
<text class="text" x="285" y="130">解决方案</text>
<text class="text" x="285" y="150">能力驱动架构</text>
<text class="text" x="285" y="170">CAP统一寻址</text>
<text class="text" x="285" y="190">全生命周期管理</text>

<!-- Right: Benefits -->
<rect class="box" x="480" y="80" width="170" height="140"/>
<text class="text-title" x="565" y="105" text-anchor="middle">核心价值</text>
<text class="text" x="495" y="130">• 能力原子化</text>
<text class="text" x="495" y="150">• 动态发现</text>
<text class="text" x="495" y="170">• 状态可观测</text>
<text class="text" x="495" y="190">• 可编排组合</text>

<!-- Arrows -->
<line class="arrow" x1="230" y1="150" x2="270" y2="150"/>
<line class="arrow" x1="430" y1="150" x2="480" y2="150"/>

<!-- Architecture Layers -->
<rect class="box-new" x="150" y="260" width="400" height="60"/>
<text class="text-title" x="350" y="295" text-anchor="middle">技术架构：发现层 → 生命周期 → 能力层 → 激活层 → 会话层</text>

</svg>
