<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" width="750px" height="450px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-active { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="710" height="35" rx="4"/>
<text class="text-header" x="375" y="38" text-anchor="middle">Skill生命周期状态转换图</text>

<!-- States -->
<rect class="box" x="50" y="80" width="100" height="35"/>
<text class="text-title" x="100" y="103" text-anchor="middle">DISCOVERED</text>

<rect class="box" x="170" y="80" width="100" height="35"/>
<text class="text-title" x="220" y="103" text-anchor="middle">INSTALLING</text>

<rect class="box" x="290" y="80" width="100" height="35"/>
<text class="text-title" x="340" y="103" text-anchor="middle">INSTALLED</text>

<rect class="box" x="410" y="80" width="100" height="35"/>
<text class="text-title" x="460" y="103" text-anchor="middle">ACTIVATING</text>

<rect class="box-active" x="530" y="80" width="100" height="35"/>
<text class="text-title" x="580" y="103" text-anchor="middle">ACTIVATED</text>

<rect class="box" x="650" y="80" width="80" height="35"/>
<text class="text-title" x="690" y="103" text-anchor="middle">ERROR</text>

<!-- Arrows Row 1 -->
<line class="arrow" x1="150" y1="97" x2="170" y2="97"/>
<line class="arrow" x1="270" y1="97" x2="290" y2="97"/>
<line class="arrow" x1="390" y1="97" x2="410" y2="97"/>
<line class="arrow" x1="510" y1="97" x2="530" y2="97"/>

<!-- Second Row -->
<rect class="box" x="290" y="160" width="100" height="35"/>
<text class="text-title" x="340" y="183" text-anchor="middle">DEACTIVATING</text>

<rect class="box" x="410" y="160" width="100" height="35"/>
<text class="text-title" x="460" y="183" text-anchor="middle">DEACTIVATED</text>

<rect class="box" x="530" y="160" width="100" height="35"/>
<text class="text-title" x="580" y="183" text-anchor="middle">UNINSTALLING</text>

<rect class="box" x="650" y="160" width="80" height="35"/>
<text class="text-title" x="690" y="183" text-anchor="middle">UNINSTALLED</text>

<!-- Arrows from ACTIVATED -->
<line class="arrow" x1="560" y1="115" x2="560" y2="130"/>
<line class="arrow" x1="560" y1="130" x2="500" y2="145"/>
<line class="arrow" x1="500" y1="145" x2="500" y2="160"/>

<line class="arrow" x1="580" y1="115" x2="620" y2="130"/>
<line class="arrow" x1="620" y1="130" x2="650" y2="130"/>
<line class="arrow" x1="650" y1="130" x2="650" y2="160"/>

<!-- Arrows to DEACTIVATED -->
<line class="arrow" x1="340" y1="195" x2="340" y2="210"/>
<line class="arrow" x1="340" y1="210" x2="410" y2="210"/>
<line class="arrow" x1="410" y1="210" x2="460" y2="195"/>

<!-- Arrow from DEACTIVATED to UNINSTALLING -->
<line class="arrow" x1="510" y1="177" x2="530" y2="177"/>

<!-- Arrow from UNINSTALLING to UNINSTALLED -->
<line class="arrow" x1="630" y1="177" x2="650" y2="177"/>

<!-- Error arrows -->
<line class="arrow" x1="80" y1="115" x2="80" y2="140"/>
<line class="arrow" x1="80" y1="140" x2="690" y2="140"/>
<line class="arrow" x1="690" y1="140" x2="690" y2="115"/>

<line class="arrow" x1="220" y1="115" x2="220" y2="140"/>
<line class="arrow" x1="690" y1="180" x2="690" y2="210"/>
<line class="arrow" x1="690" y1="210" x2="640" y2="225"/>

<!-- Labels -->
<text class="text" x="50" y="250">主要状态流:</text>
<text class="text" x="50" y="275">install() → activate() → deactivate() → uninstall()</text>

<text class="text" x="50" y="310">事务性操作:</text>
<text class="text" x="50" y="335">激活失败自动回滚到 INSTALLED 状态</text>
<text class="text" x="50" y="355">卸载失败可重试或强制卸载</text>

</svg>
