<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-current { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 14px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">软件能力检索核心论点</text>

<!-- Thesis 1 -->
<rect class="box" x="50" y="80" width="170" height="80"/>
<text class="text-title" x="135" y="105" text-anchor="middle">论点一</text>
<text class="text" x="65" y="125">能力原子化</text>
<text class="text-small" x="65" y="145">最小可复用单元</text>

<!-- Thesis 2 -->
<rect class="box" x="265" y="80" width="170" height="80"/>
<text class="text-title" x="350" y="105" text-anchor="middle">论点二</text>
<text class="text" x="280" y="125">能力可发现</text>
<text class="text-small" x="280" y="145">动态发现机制</text>

<!-- Thesis 3 -->
<rect class="box" x="480" y="80" width="170" height="80"/>
<text class="text-title" x="565" y="105" text-anchor="middle">论点三</text>
<text class="text" x="495" y="125">能力可编排</text>
<text class="text-small" x="495" y="145">灵活流程组合</text>

<!-- Thesis 4 -->
<rect class="box" x="265" y="190" width="170" height="80"/>
<text class="text-title" x="350" y="215" text-anchor="middle">论点四</text>
<text class="text" x="280" y="235">能力可治理</text>
<text class="text-small" x="280" y="255">完整生命周期</text>

<!-- Arrows connecting -->
<line class="arrow" x1="220" y1="120" x2="265" y2="120"/>
<line class="arrow" x1="435" y1="120" x2="480" y2="120"/>
<line class="arrow" x1="350" y1="160" x2="350" y2="190"/>

</svg>
