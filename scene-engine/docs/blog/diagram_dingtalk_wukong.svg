<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700px" height="480px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-assistant { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-capability { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
        .box-external { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">钉钉悟空平台架构</text>

<!-- Wukong Assistant -->
<rect class="box-assistant" x="200" y="70" width="300" height="50" rx="8"/>
<text class="text-title" x="350" y="100" text-anchor="middle">悟空智能助手 (对话式交互入口)</text>

<!-- Capability Layer 1 -->
<rect class="box-capability" x="50" y="170" width="120" height="50"/>
<text class="text-title" x="110" y="195" text-anchor="middle">日程能力</text>
<text class="text-small" x="110" y="210" text-anchor="middle">会议、提醒</text>

<rect class="box-capability" x="200" y="170" width="120" height="50"/>
<text class="text-title" x="260" y="195" text-anchor="middle">文档能力</text>
<text class="text-small" x="260" y="210" text-anchor="middle">编辑、协作</text>

<rect class="box-capability" x="350" y="170" width="120" height="50"/>
<text class="text-title" x="410" y="195" text-anchor="middle">会议能力</text>
<text class="text-small" x="410" y="210" text-anchor="middle">视频、直播</text>

<rect class="box-capability" x="500" y="170" width="120" height="50"/>
<text class="text-title" x="560" y="195" text-anchor="middle">审批能力</text>
<text class="text-small" x="560" y="210" text-anchor="middle">流程、表单</text>

<!-- Capability Layer 2 -->
<rect class="box-capability" x="125" y="250" width="120" height="50"/>
<text class="text-title" x="185" y="275" text-anchor="middle">通讯能力</text>
<text class="text-small" x="185" y="290" text-anchor="middle">消息、通知</text>

<rect class="box-capability" x="275" y="250" width="120" height="50"/>
<text class="text-title" x="335" y="275" text-anchor="middle">报表能力</text>
<text class="text-small" x="335" y="290" text-anchor="middle">数据、图表</text>

<rect class="box-capability" x="425" y="250" width="120" height="50"/>
<text class="text-title" x="485" y="275" text-anchor="middle">存储能力</text>
<text class="text-small" x="485" y="290" text-anchor="middle">网盘、备份</text>

<!-- Third Party -->
<rect class="box-external" x="200" y="340" width="300" height="50" rx="8"/>
<text class="text-title" x="350" y="370" text-anchor="middle">第三方应用接入</text>

<!-- Arrows -->
<line class="arrow" x1="350" y1="120" x2="110" y2="170"/>
<line class="arrow" x1="350" y1="120" x2="260" y2="170"/>
<line class="arrow" x1="350" y1="120" x2="410" y2="170"/>
<line class="arrow" x1="350" y1="120" x2="560" y2="170"/>

<line class="arrow" x1="110" y1="220" x2="185" y2="250"/>
<line class="arrow" x1="260" y1="220" x2="335" y2="250"/>
<line class="arrow" x1="410" y1="220" x2="485" y2="250"/>

<line class="arrow" x1="185" y1="300" x2="300" y2="340"/>
<line class="arrow" x1="335" y1="300" x2="350" y2="340"/>
<line class="arrow" x1="485" y1="300" x2="400" y2="340"/>

<!-- Features -->
<text class="text-title" x="350" y="430" text-anchor="middle">核心特点</text>
<text class="text" x="100" y="455">• 场景化的能力聚合</text>
<text class="text" x="100" y="475">• 对话式的能力调用</text>
<text class="text" x="400" y="455">• 开放的第三方接入</text>
<text class="text" x="400" y="475">• 统一的身份认证</text>

</svg>
