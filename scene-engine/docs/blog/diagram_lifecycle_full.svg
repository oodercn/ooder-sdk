<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700px" height="400px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-active { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">能力生命周期全景</text>

<!-- States -->
<rect class="box" x="30" y="80" width="90" height="40"/>
<text class="text-title" x="75" y="105" text-anchor="middle">DISCOVERED</text>

<rect class="box" x="140" y="80" width="90" height="40"/>
<text class="text-title" x="185" y="105" text-anchor="middle">INSTALLING</text>

<rect class="box" x="250" y="80" width="90" height="40"/>
<text class="text-title" x="295" y="105" text-anchor="middle">INSTALLED</text>

<rect class="box" x="360" y="80" width="90" height="40"/>
<text class="text-title" x="405" y="105" text-anchor="middle">ACTIVATING</text>

<rect class="box-active" x="470" y="80" width="90" height="40"/>
<text class="text-title" x="515" y="105" text-anchor="middle">ACTIVATED</text>

<rect class="box" x="580" y="80" width="90" height="40"/>
<text class="text-title" x="625" y="105" text-anchor="middle">ERROR</text>

<!-- Arrows row 1 -->
<line class="arrow" x1="120" y1="100" x2="140" y2="100"/>
<line class="arrow" x1="230" y1="100" x2="250" y2="100"/>
<line class="arrow" x1="340" y1="100" x2="360" y2="100"/>
<line class="arrow" x1="450" y1="100" x2="470" y2="100"/>

<!-- Row 2 -->
<rect class="box" x="250" y="160" width="100" height="40"/>
<text class="text-title" x="300" y="185" text-anchor="middle">DEACTIVATING</text>

<rect class="box" x="380" y="160" width="100" height="40"/>
<text class="text-title" x="430" y="185" text-anchor="middle">DEACTIVATED</text>

<rect class="box" x="510" y="160" width="100" height="40"/>
<text class="text-title" x="560" y="185" text-anchor="middle">UNINSTALLING</text>

<rect class="box" x="620" y="160" width="70" height="40"/>
<text class="text-title" x="655" y="185" text-anchor="middle">UNINSTALLED</text>

<!-- Arrows -->
<line class="arrow" x1="500" y1="120" x2="500" y2="140"/>
<line class="arrow" x1="500" y1="140" x2="430" y2="160"/>
<line class="arrow" x1="480" y1="140" x2="300" y2="160"/>
<line class="arrow" x1="350" y1="200" x2="380" y2="180"/>
<line class="arrow" x1="480" y1="180" x2="510" y2="180"/>
<line class="arrow" x1="610" y1="180" x2="620" y2="180"/>

<!-- Value -->
<rect class="box" x="30" y="250" width="640" height="80"/>
<text class="text-title" x="350" y="275" text-anchor="middle">生命周期管理的价值</text>
<text class="text" x="60" y="300">• 状态可观测：每个能力状态一目了然</text>
<text class="text" x="60" y="320">• 操作可追溯：全程记录操作历史</text>
<text class="text" x="400" y="300">• 故障可恢复：异常时可回滚</text>
<text class="text" x="400" y="320">• 资源可管理：不用的能力可释放</text>

</svg>
