<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800px" height="550px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-app { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-engine { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
        .box-capability { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
        .box-infra { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">ooderAgent MVP 产品架构图</text>

<!-- User Interface Layer -->
<rect class="box-app" x="100" y="70" width="600" height="60"/>
<text class="text-title" x="400" y="95" text-anchor="middle">用户界面层</text>
<text class="text" x="150" y="115">Web控制台</text>
<text class="text" x="300" y="115">移动端APP</text>
<text class="text" x="450" y="115">第三方集成</text>
<text class="text" x="600" y="115">CLI工具</text>

<!-- API Gateway Layer -->
<rect class="box" x="100" y="150" width="600" height="50"/>
<text class="text-title" x="400" y="180" text-anchor="middle">API网关层：REST API | WebSocket | 认证授权 | 限流熔断</text>

<!-- Core Engine Layer -->
<rect class="box-engine" x="100" y="220" width="600" height="80"/>
<text class="text-title" x="400" y="245" text-anchor="middle">核心引擎层</text>
<text class="text" x="130" y="270">SceneEngine</text>
<text class="text" x="280" y="270">ActivationFlow</text>
<text class="text" x="430" y="270">CapabilityRegistry</text>
<text class="text" x="580" y="270">Discovery</text>
<text class="text" x="200" y="290">生命周期管理</text>
<text class="text" x="400" y="290">能力注册与发现</text>
<text class="text" x="600" y="290">依赖注入</text>

<!-- Capability Layer -->
<rect class="box-capability" x="100" y="320" width="600" height="70"/>
<text class="text-title" x="400" y="345" text-anchor="middle">能力服务层</text>
<text class="text" x="130" y="370">LLM Provider</text>
<text class="text" x="280" y="370">Knowledge Provider</text>
<text class="text" x="450" y="370">Storage Provider</text>
<text class="text" x="620" y="370">Custom Skills</text>

<!-- Infrastructure Layer -->
<rect class="box-infra" x="100" y="410" width="600" height="70"/>
<text class="text-title" x="400" y="435" text-anchor="middle">基础设施层</text>
<text class="text" x="130" y="460">PostgreSQL</text>
<text class="text" x="280" y="460">Redis</text>
<text class="text" x="400" y="460">Milvus</text>
<text class="text" x="520" y="460">消息队列</text>
<text class="text" x="620" y="460">对象存储</text>

<!-- Arrows -->
<line class="arrow" x1="400" y1="130" x2="400" y2="150"/>
<line class="arrow" x1="400" y1="200" x2="400" y2="220"/>
<line class="arrow" x1="400" y1="300" x2="400" y2="320"/>
<line class="arrow" x1="400" y1="390" x2="400" y2="410"/>

<!-- Tech Stack Labels -->
<text class="text" x="750" y="100" text-anchor="end" fill="#64748b">Vue.js + Spring Boot</text>
<text class="text" x="750" y="255" text-anchor="end" fill="#64748b">Java 17+</text>
<text class="text" x="750" y="355" text-anchor="end" fill="#64748b">SPI插件机制</text>
<text class="text" x="750" y="445" text-anchor="end" fill="#64748b">云原生架构</text>

</svg>
