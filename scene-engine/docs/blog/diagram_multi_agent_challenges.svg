<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-agent { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-question { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 14px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">多Agent协作的挑战</text>

<!-- Agent A -->
<rect class="box-agent" x="50" y="80" width="120" height="60"/>
<text class="text-title" x="110" y="105" text-anchor="middle">Agent A</text>
<text class="text" x="65" y="125">财务助手</text>

<!-- Agent B -->
<rect class="box-agent" x="290" y="80" width="120" height="60"/>
<text class="text-title" x="350" y="105" text-anchor="middle">Agent B</text>
<text class="text" x="305" y="125">库存助手</text>

<!-- Agent C -->
<rect class="box-agent" x="530" y="80" width="120" height="60"/>
<text class="text-title" x="590" y="105" text-anchor="middle">Agent C</text>
<text class="text" x="545" y="125">采购助手</text>

<!-- Connections -->
<line class="arrow" x1="170" y1="110" x2="290" y2="110"/>
<line class="arrow" x1="410" y1="110" x2="530" y2="110"/>
<line class="arrow" x1="110" y1="140" x2="110" y2="170"/>
<line class="arrow" x1="110" y1="170" x2="350" y2="170"/>
<line class="arrow" x1="350" y1="170" x2="350" y2="140"/>

<!-- Question marks -->
<text class="text-title" x="230" y="100" text-anchor="middle" fill="#f59e0b">?</text>
<text class="text-title" x="470" y="100" text-anchor="middle" fill="#f59e0b">?</text>

<!-- Core Questions -->
<rect class="box-question" x="100" y="200" width="500" height="100"/>
<text class="text-title" x="350" y="225" text-anchor="middle">核心问题</text>
<text class="text" x="130" y="255">• Agent如何发现其他Agent的能力？</text>
<text class="text" x="130" y="275">• 能力如何统一寻址？</text>
<text class="text" x="380" y="255">• 上下文如何传递？</text>
<text class="text" x="380" y="275">• 生命周期如何同步？</text>

</svg>
