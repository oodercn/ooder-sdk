<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800px" height="400px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-current { fill: #dbeafe; stroke: #1e40af; stroke-width: 3; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .arrow-highlight { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowhead-blue); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 13px; fill: #334155; }
        .text-title { font-size: 15px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .text-small { font-size: 11px; fill: #64748b; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="760" height="35" rx="4"/>
<text class="text-header" x="400" y="38" text-anchor="middle">软件形态演进历程</text>

<!-- Stage 1 -->
<rect class="box" x="30" y="70" width="220" height="140"/>
<text class="text-title" x="140" y="100" text-anchor="middle">第一阶段：本地部署时代</text>
<text class="text" x="45" y="125">• 软件作为产品销售</text>
<text class="text" x="45" y="145">• 一次性购买，永久使用</text>
<text class="text" x="45" y="165">• 升级维护成本高</text>
<text class="text" x="45" y="185">• 数据孤岛严重</text>

<!-- Arrow 1 -->
<line class="arrow" x1="250" y1="140" x2="280" y2="140"/>

<!-- Stage 2 -->
<rect class="box" x="290" y="70" width="220" height="140"/>
<text class="text-title" x="400" y="100" text-anchor="middle">第二阶段：SaaS云服务时代</text>
<text class="text" x="305" y="125">• 软件作为服务订阅</text>
<text class="text" x="305" y="145">• 按需付费，弹性扩展</text>
<text class="text" x="305" y="165">• 多租户架构</text>
<text class="text" x="305" y="185">• 数据集中管理</text>

<!-- Arrow 2 -->
<line class="arrow" x1="510" y1="140" x2="540" y2="140"/>

<!-- Stage 3 (Current) -->
<rect class="box-current" x="550" y="70" width="220" height="140"/>
<text class="text-title" x="660" y="100" text-anchor="middle">第三阶段：软件技能化时代</text>
<text class="text" x="565" y="125">• 软件能力原子化</text>
<text class="text" x="565" y="145">• AI驱动的智能调用</text>
<text class="text" x="565" y="165">• 能力可发现、可组合</text>
<text class="text" x="565" y="185">• 从"使用软件"到"对话能力"</text>

<!-- Current indicator -->
<text class="text-small" x="660" y="225" text-anchor="middle" font-weight="bold" fill="#2563eb">← 我们在这里</text>

<!-- Bottom timeline -->
<line x1="140" y1="280" x2="660" y2="280" stroke="#e2e8f0" stroke-width="2"/>
<circle cx="140" cy="280" r="6" fill="#64748b"/>
<circle cx="400" cy="280" r="6" fill="#64748b"/>
<circle cx="660" cy="280" r="8" fill="#2563eb"/>
<text class="text-small" x="140" y="305" text-anchor="middle">1990s-2000s</text>
<text class="text-small" x="400" y="305" text-anchor="middle">2010s-2020s</text>
<text class="text-small" x="660" y="305" text-anchor="middle" fill="#2563eb" font-weight="bold">2024+</text>

<!-- Evolution labels -->
<text class="text-small" x="140" y="330" text-anchor="middle">本地化</text>
<text class="text-small" x="400" y="330" text-anchor="middle">云化</text>
<text class="text-small" x="660" y="330" text-anchor="middle" fill="#2563eb" font-weight="bold">智能化</text>

</svg>
