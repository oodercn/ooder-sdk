<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="750px" height="500px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-active { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 11px; fill: #334155; }
        .text-title { font-size: 12px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="710" height="35" rx="4"/>
<text class="text-header" x="375" y="38" text-anchor="middle">Skill生命周期状态转换完整图</text>

<!-- Row 1 -->
<rect class="box" x="30" y="80" width="95" height="35"/>
<text class="text-title" x="77" y="103" text-anchor="middle">DISCOVERED</text>

<rect class="box" x="145" y="80" width="95" height="35"/>
<text class="text-title" x="192" y="103" text-anchor="middle">INSTALLING</text>

<rect class="box" x="260" y="80" width="95" height="35"/>
<text class="text-title" x="307" y="103" text-anchor="middle">INSTALLED</text>

<rect class="box" x="375" y="80" width="95" height="35"/>
<text class="text-title" x="422" y="103" text-anchor="middle">ACTIVATING</text>

<rect class="box-active" x="490" y="80" width="95" height="35"/>
<text class="text-title" x="537" y="103" text-anchor="middle">ACTIVATED</text>

<rect class="box" x="605" y="80" width="80" height="35"/>
<text class="text-title" x="645" y="103" text-anchor="middle">ERROR</text>

<!-- Arrows Row 1 -->
<line class="arrow" x1="125" y1="97" x2="145" y2="97"/>
<line class="arrow" x1="240" y1="97" x2="260" y2="97"/>
<line class="arrow" x1="355" y1="97" x2="375" y2="97"/>
<line class="arrow" x1="470" y1="97" x2="490" y2="97"/>

<!-- Row 2 -->
<rect class="box" x="260" y="160" width="100" height="35"/>
<text class="text-title" x="310" y="183" text-anchor="middle">DEACTIVATING</text>

<rect class="box" x="390" y="160" width="100" height="35"/>
<text class="text-title" x="440" y="183" text-anchor="middle">DEACTIVATED</text>

<rect class="box" x="520" y="160" width="100" height="35"/>
<text class="text-title" x="570" y="183" text-anchor="middle">UNINSTALLING</text>

<rect class="box" x="640" y="160" width="80" height="35"/>
<text class="text-title" x="680" y="183" text-anchor="middle">UNINSTALLED</text>

<!-- Arrows from ACTIVATED -->
<line class="arrow" x1="520" y1="115" x2="520" y2="130"/>
<line class="arrow" x1="520" y1="130" x2="460" y2="145"/>
<line class="arrow" x1="460" y1="145" x2="460" y2="160"/>

<line class="arrow" x1="555" y1="115" x2="555" y2="130"/>
<line class="arrow" x1="555" y1="130" x2="570" y2="145"/>
<line class="arrow" x1="570" y1="145" x2="570" y2="160"/>

<!-- Arrows to DEACTIVATED -->
<line class="arrow" x1="310" y1="195" x2="310" y2="210"/>
<line class="arrow" x1="310" y1="210" x2="390" y2="210"/>
<line class="arrow" x1="390" y1="210" x2="440" y2="195"/>

<!-- Arrow from DEACTIVATED to UNINSTALLING -->
<line class="arrow" x1="490" y1="177" x2="520" y2="177"/>

<!-- Arrow from UNINSTALLING to UNINSTALLED -->
<line class="arrow" x1="620" y1="177" x2="640" y2="177"/>

<!-- Error arrows -->
<line class="arrow" x1="77" y1="115" x2="77" y2="250"/>
<line class="arrow" x1="77" y1="250" x2="645" y2="250"/>
<line class="arrow" x1="645" y1="250" x2="645" y2="115"/>

<!-- Labels -->
<text class="text" x="50" y="290">主要状态流:</text>
<text class="text" x="50" y="310">install() → activate() → deactivate() → uninstall()</text>

<text class="text" x="50" y="350">事务性操作:</text>
<text class="text" x="50" y="370">激活失败自动回滚到 INSTALLED 状态</text>
<text class="text" x="50" y="390">卸载失败可重试或强制卸载</text>

<text class="text" x="400" y="290">错误恢复:</text>
<text class="text" x="400" y="310">任何状态出错 → ERROR</text>
<text class="text" x="400" y="330">可从ERROR恢复到稳定状态</text>

</svg>
