<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700px" height="350px">
<defs>
    <style>
        .bg { fill: #fafafa; }
        .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 8; }
        .box-meta { fill: #dbeafe; stroke: #1e40af; stroke-width: 2; rx: 8; }
        .box-reg { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 8; }
        .box-res { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
        .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
        .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; font-size: 12px; fill: #334155; }
        .text-title { font-size: 13px; font-weight: bold; fill: #1e40af; }
        .text-header { font-size: 16px; font-weight: bold; fill: #ffffff; }
        .title-box { fill: #2563eb; stroke: none; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>

<!-- Title -->
<rect class="title-box" x="20" y="15" width="660" height="35" rx="4"/>
<text class="text-header" x="350" y="38" text-anchor="middle">元数据驱动架构</text>

<!-- skill-index.yaml -->
<rect class="box-meta" x="50" y="80" width="150" height="80"/>
<text class="text-title" x="125" y="105" text-anchor="middle">skill-index.yaml</text>
<text class="text" x="65" y="130">• 静态配置</text>
<text class="text" x="65" y="150">• 元数据定义</text>

<!-- Capability Registry -->
<rect class="box-reg" x="275" y="80" width="150" height="80"/>
<text class="text-title" x="350" y="105" text-anchor="middle">Capability Registry</text>
<text class="text" x="290" y="130">• 动态注册</text>
<text class="text" x="290" y="150">• 能力索引</text>

<!-- Dependency Resolver -->
<rect class="box-res" x="500" y="80" width="150" height="80"/>
<text class="text-title" x="575" y="105" text-anchor="middle">Dependency Resolver</text>
<text class="text" x="515" y="130">• 自动注入</text>
<text class="text" x="515" y="150">• 依赖解析</text>

<!-- Arrows -->
<line class="arrow" x1="200" y1="120" x2="275" y2="120"/>
<line class="arrow" x1="425" y1="120" x2="500" y2="120"/>

<!-- Bottom boxes -->
<rect class="box" x="50" y="200" width="150" height="60"/>
<text class="text-title" x="125" y="225" text-anchor="middle">静态配置</text>
<text class="text" x="65" y="245">编译时确定</text>

<rect class="box" x="275" y="200" width="150" height="60"/>
<text class="text-title" x="350" y="225" text-anchor="middle">动态注册</text>
<text class="text" x="290" y="245">运行时发现</text>

<rect class="box" x="500" y="200" width="150" height="60"/>
<text class="text-title" x="575" y="225" text-anchor="middle">自动注入</text>
<text class="text" x="515" y="245">依赖自动满足</text>

<!-- Arrows down -->
<line class="arrow" x1="125" y1="160" x2="125" y2="200"/>
<line class="arrow" x1="350" y1="160" x2="350" y2="200"/>
<line class="arrow" x1="575" y1="160" x2="575" y2="200"/>

</svg>
