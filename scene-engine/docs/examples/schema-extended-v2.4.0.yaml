apiVersion: config.ooder.net/v1
kind: SkillIndexSchema

metadata:
  version: "2.4.0"
  lastUpdated: "2026-03-12"
  description: "Skill Index 配置规范定义 - SE标准 v1.2.0 (扩展版，包含 participants 和 driverConditions)"

spec:
  fields:
    - name: id
      type: string
      required: true
      pattern: "^skill-[a-z0-9-]+$"
      description: "技能唯一标识"

    - name: name
      type: string
      required: true
      maxLength: 100
      description: "技能显示名称"

    - name: version
      type: string
      required: true
      pattern: "^\\d+\\.\\d+\\.\\d+$"
      description: "语义化版本号"

    - name: description
      type: string
      required: true
      maxLength: 500
      description: "技能描述"

    - name: skillForm
      type: enum
      required: true
      values: [SCENE, PROVIDER, DRIVER, INTERNAL]
      description: "技能形态"

    - name: sceneType
      type: enum
      required: false
      values: [AUTO, TRIGGER]
      condition: "skillForm == SCENE"
      description: "场景类型 (仅SCENE时必需)"

    - name: visibility
      type: enum
      required: true
      values: [public, developer, internal]
      description: "可见性"

    - name: businessCategory
      type: enum
      required: true
      ref: "categories.yaml#/businessCategories"
      description: "业务分类"

    - name: subCategory
      type: string
      required: false
      maxLength: 50
      description: "子分类"

    - name: category
      type: enum
      required: true
      ref: "categories.yaml#/skillCategories"
      description: "SE标准技术分类"

    - name: capabilityCategory
      type: enum
      required: true
      ref: "categories.yaml#/capabilityCategories"
      description: "能力地址分类"

    - name: tags
      type: array
      required: false
      itemType: string
      description: "技能标签"

    - name: capabilityAddresses
      type: object
      required: true
      description: "能力地址配置"
      properties:
        required:
          type: array
          itemType: object
          description: "必需的能力地址"
        optional:
          type: array
          itemType: object
          description: "可选的能力地址"

    - name: roles
      type: array
      required: false
      condition: "skillForm == SCENE"
      description: "场景角色配置"
      itemType: object
      properties:
        name:
          type: string
          required: true
        displayName:
          type: string
          required: true
        minCount:
          type: integer
          required: true
        maxCount:
          type: integer
          required: true
        permissions:
          type: array
          itemType: string
          required: true

    # ============================================
    # 新增字段: participants 参与者配置
    # 用途: 定义场景安装时的参与者配置规则
    # 适用条件: skillForm == SCENE
    # ============================================
    - name: participants
      type: object
      required: false
      condition: "skillForm == SCENE"
      description: "参与者配置"
      properties:
        leader:
          type: object
          required: true
          description: "主导者配置"
          properties:
            required:
              type: boolean
              default: true
              description: "是否必须指定主导者"
            defaultToCurrentUser:
              type: boolean
              default: true
              description: "默认为当前用户"
            permissions:
              type: array
              itemType: string
              description: "主导者权限列表"
        collaborators:
          type: object
          required: false
          description: "协作者配置"
          properties:
            minCount:
              type: integer
              default: 0
              description: "最小协作者数量"
            maxCount:
              type: integer
              default: 10
              description: "最大协作者数量"
            selectionType:
              type: enum
              values: [USER, ROLE, GROUP]
              default: USER
              description: "选择类型"
        pushType:
          type: enum
          required: false
          values: [SHARE, INVITE, DELEGATE]
          default: SHARE
          description: "推送类型"

    # ============================================
    # 新增字段: driverConditions 驱动条件配置
    # 用途: 定义场景的触发条件配置规则
    # 适用条件: skillForm == SCENE || skillForm == DRIVER
    # ============================================
    - name: driverConditions
      type: object
      required: false
      condition: "skillForm == SCENE || skillForm == DRIVER"
      description: "驱动条件配置"
      properties:
        supportedTypes:
          type: array
          itemType: enum
          values: [MANUAL, SCHEDULE, EVENT, WEBHOOK]
          required: true
          description: "支持的触发类型"
        defaultType:
          type: enum
          values: [MANUAL, SCHEDULE, EVENT, WEBHOOK]
          default: MANUAL
          description: "默认触发类型"
        scheduleConfig:
          type: object
          required: false
          description: "定时触发配置"
          properties:
            cronExpression:
              type: string
              description: "Cron表达式"
            timezone:
              type: string
              default: "Asia/Shanghai"
              description: "时区"
        eventConfig:
          type: object
          required: false
          description: "事件触发配置"
          properties:
            eventTypes:
              type: array
              itemType: string
              description: "监听的事件类型"
            eventSource:
              type: string
              description: "事件来源"

  validation:
    - rule: sceneTypeRequired
      condition: "skillForm == 'SCENE' && !sceneType"
      message: "SCENE技能必须指定sceneType (AUTO或TRIGGER)"
      severity: ERROR

    - rule: versionFormat
      condition: "!version || !version.matches('^\\d+\\.\\d+\\.\\d+$')"
      message: "版本号格式必须为 x.y.z"
      severity: ERROR

    - rule: idFormat
      condition: "!id || !id.matches('^skill-[a-z0-9-]+$')"
      message: "ID格式必须为 skill-{name}"
      severity: ERROR

    - rule: capabilityAddressesRequired
      condition: "!capabilityAddresses || !capabilityAddresses.required"
      message: "必须声明必需的能力地址"
      severity: WARNING

    - rule: rolesRequiredForScene
      condition: "skillForm == 'SCENE' && (!roles || roles.isEmpty())"
      message: "SCENE技能建议配置角色"
      severity: WARNING

    # ============================================
    # 新增验证规则
    # ============================================
    - rule: participantsLeaderRequired
      condition: "skillForm == 'SCENE' && participants && !participants.leader"
      message: "如果配置了participants，则必须包含leader配置"
      severity: ERROR

    - rule: driverConditionsSupportedTypesRequired
      condition: "(skillForm == 'SCENE' || skillForm == 'DRIVER') && driverConditions && !driverConditions.supportedTypes"
      message: "如果配置了driverConditions，则必须指定supportedTypes"
      severity: ERROR

    - rule: driverConditionsDefaultTypeValid
      condition: "driverConditions && driverConditions.defaultType && !driverConditions.supportedTypes.contains(driverConditions.defaultType)"
      message: "defaultType必须在supportedTypes中"
      severity: ERROR

    - rule: participantsCollaboratorsCountValid
      condition: "participants && participants.collaborators && participants.collaborators.minCount != null && participants.collaborators.maxCount != null && participants.collaborators.minCount > participants.collaborators.maxCount"
      message: "协作者最小数量不能大于最大数量"
      severity: ERROR
